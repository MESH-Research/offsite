[project]
name = "offsite-backup"
version = "0.1.0"
description = "Portable offsite backups of Knowledge Commons AWS resources (RDS, EFS, S3, ECS) to Hetzner Storage Boxes via restic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "environs>=15.2.0",
    "marshmallow>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[rds,s3,ecs,cloudwatch]>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offsite_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.commitizen]
version = "0.1.0"
version_files = [
    "src/offsite_backup/__version__.py",
    "pyproject.toml:version",
]
update_changelog_on_bump = true
